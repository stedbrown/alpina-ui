name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      verify_release: true

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish the verified archive with provenance
        shell: bash
        env:
          ARCHIVE: ${{ needs.verify.outputs.archive }}
          SHA512: ${{ needs.verify.outputs.sha512 }}
        run: |
          tarball="recipes/rubrica/vendor/$ARCHIVE"
          printf '%s  %s\n' "$SHA512" "$tarball" | sha512sum --check
          npm publish "$tarball" --access public --provenance --ignore-scripts
